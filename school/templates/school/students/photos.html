<!DOCTYPE html>
<html>

<head>

    <title>Student Photos</title>

</head>

<body>

<h1>

Photos of {{ student.first_name }} {{ student.last_name }}

</h1>

<p>

<a href="/dashboard/students/">

← Back to Students

</a>

</p>

<hr>

<h3>

Upload Photo

</h3>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <input
        type="file"
        name="photo"
    >

    <br><br>

    <button type="submit">

        Upload

    </button>

</form>

<hr>

<h3>Uploaded Photos</h3>

{% if photos %}

    {% for photo in photos %}

        <div style="margin-bottom:20px;">

            <img
                src="{{ photo }}"
                width="200"
                style="border:1px solid #ccc;"
            >

            <br>

            {{ photo }}

        </div>

    {% endfor %}

{% else %}

<p>No photos uploaded yet.</p>

{% endif %}

</body>

</html>
