<!DOCTYPE html>
<html>

<head>

    <title>Student Photos</title>

    <style>

.gallery{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.photo-card{

    border:1px solid #ccc;
    padding:15px;
    width:220px;
    text-align:center;
    border-radius:8px;

}

.photo-card img{

    width:200px;
    height:200px;
    object-fit:cover;
    border-radius:5px;

}

.filename{

    margin-top:10px;
    font-size:14px;
    color:#555;
    word-break:break-word;

}

.delete-btn{

    margin-top:12px;
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    border-radius:5px;

}

.delete-btn:hover{

    background:darkred;

}

</style>

</head>

<body>

<h1>

Photos of {{ student.first_name }} {{ student.last_name }}

</h1>

<p>

<a href="/dashboard/students/">

← Back to Students

</a>

</p>

<hr>

<h3>

Upload Photo

</h3>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <input
        type="file"
        name="photo"
    >

    <br><br>

    <button type="submit">

        Upload

    </button>

</form>

<hr>

<h3>Uploaded Photos</h3>

{% if photos %}

   {% for photo in photos %}

<div style="margin-bottom:20px;">

    <img
        src="{{ photo }}"
        width="200"
        style="border:1px solid #ccc;"
    >

    <br><br>

    <form
        method="POST"
        action="/dashboard/students/{{ student.id }}/photos/delete/"
    >

        {% csrf_token %}

        <input
            type="hidden"
            name="photo"
            value="{{ photo }}"
        >

        <button type="submit">

            Delete Photo

        </button>

    </form>

</div>

{% endfor %}

{% else %}

<p>No photos uploaded yet.</p>

{% endif %}

</body>

</html>
