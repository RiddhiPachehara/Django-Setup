<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <style>

        .error{
            color:red;
            font-size:14px;
            display:block;
            margin-top:5px;
        }

        .error-input{
            border:2px solid red;
        }

    </style>

</head>

<body>

<h1>Add Student</h1>

<p>
    <a href="/dashboard/students/">← Back</a>
</p>

<form method="POST" id="studentForm" novalidate>

    {% csrf_token %}

    <p>

        <label>Classroom</label><br>

        <select id="classroom" name="classroom">

            <option value="">Select Classroom</option>

            {% for classroom in classrooms %}

            <option
                value="{{ classroom.id }}"
                {% if old.classroom == classroom.id|stringformat:"s" %}selected{% endif %}
            >
                {{ classroom.class_name }}
            </option>

            {% endfor %}

        </select>

        <span class="error" id="classroomError">
            {{ errors.classroom }}
        </span>

    </p>

    <p>

        <label>First Name</label><br>

        <input
            type="text"
            id="first_name"
            name="first_name"
            value="{{ old.first_name }}"
        >

        <span class="error" id="firstNameError">
            {{ errors.first_name }}
        </span>

    </p>

    <p>

        <label>Last Name</label><br>

        <input
            type="text"
            id="last_name"
            name="last_name"
            value="{{ old.last_name }}"
        >

        <span class="error" id="lastNameError">
            {{ errors.last_name }}
        </span>

    </p>

    <p>

        <label>Age</label><br>

        <input
            type="number"
            id="age"
            name="age"
            value="{{ old.age }}"
        >

        <span class="error" id="ageError">
            {{ errors.age }}
        </span>

    </p>

    <p>

        <label>Roll Number</label><br>

        <input
            type="number"
            id="roll_number"
            name="roll_number"
            value="{{ old.roll_number }}"
        >

        <span class="error" id="rollNumberError">
            {{ errors.roll_number }}
        </span>

    </p>

    <button type="submit">
        Save Student
    </button>

</form>

</body>

</html>
