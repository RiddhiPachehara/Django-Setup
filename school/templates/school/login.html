<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <style>
        .error{
            color:red;
        }
    </style>

</head>

<body>

<h2>Admin Login</h2>

{% for message in messages %}
<p class="error">{{ message }}</p>
{% endfor %}

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Username</label><br>
        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >
    </p>

    <p>
        <label>Password</label><br>
        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >
    </p>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
